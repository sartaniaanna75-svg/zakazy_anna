<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Заказы поставщикам</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 0; background: #f4f6f8; color: #1c2430; }
    header { background: #16324f; color: white; padding: 16px 24px; }
    nav a, nav span { color: white; text-decoration: none; margin-right: 18px; font-size: 18px; }
    nav span.disabled { opacity: 0.45; }
    main { padding: 24px; max-width: 1100px; }
    .card { background: white; border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
    button, .button { background: #16324f; color: white; border: 0; border-radius: 8px; padding: 10px 16px; font-size: 16px; cursor: pointer; }
    button.secondary { background: #6b7280; }
    button:disabled { background: #b9c0c8; cursor: not-allowed; }
    input[type="text"], input[type="file"] { font-size: 16px; padding: 8px; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 8px; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    .warn { color: #9a3412; }
    .muted { color: #4b5563; }
    .flash { background: #ecfdf3; border: 1px solid #86efac; padding: 10px 12px; border-radius: 8px; }
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Сегодня</a>
      <a href="/nomenclature">Номенклатура</a>
      <a href="/prices">Прайсы</a>
      <a href="/order">Заказ</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
